<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro de Alunos - SENAI</title>
    <link rel="stylesheet" href="style.css"> <!-- Link para o arquivo CSS que vamos criar depois -->
</head>
<body>
    <header>
        <div class="container">
            <img src="https://www.senai.br/sites/default/files/2022-06/logo-senai.png" alt="Logo SENAI" class="logo-senai">
            <h1>Cadastro e Consulta de Alunos</h1>
        </div>
    </header>

    <main class="container">
        <section id="cadastro-aluno">
            <h2>Cadastrar Novo Aluno</h2>
            <form id="form-aluno">
                <h3>Dados Pessoais</h3>
                <div class="form-group">
                    <label for="nomeCompleto">Nome Completo:</label>
                    <input type="text" id="nomeCompleto" name="nomeCompleto" required>
                </div>
                <div class="form-group">
                    <label for="dataNascimento">Data de Nascimento:</label>
                    <input type="date" id="dataNascimento" name="dataNascimento" required>
                </div>
                <div class="form-group">
                    <label for="cpf">CPF (Opcional):</label>
                    <input type="text" id="cpf" name="cpf" pattern="[0-9]{3}\.?[0-9]{3}\.?[0-9]{3}\-?[0-9]{2}" placeholder="Ex: 123.456.789-00">
                </div>
                <div class="form-group">
                    <label for="rg">RG (Opcional):</label>
                    <input type="text" id="rg" name="rg" placeholder="Ex: 12.345.678-9">
                </div>
                <div class="form-group">
                    <label for="sexoGenero">Sexo/Gênero:</label>
                    <select id="sexoGenero" name="sexoGenero" required>
                        <option value="">Selecione</option>
                        <option value="feminino">Feminino</option>
                        <option value="masculino">Masculino</option>
                        <option value="nao-binario">Não Binário</option>
                        <option value="prefiro-nao-dizer">Prefiro não dizer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="nacionalidade">Nacionalidade:</label>
                    <input type="text" id="nacionalidade" name="nacionalidade" value="Brasileira" required>
                </div>

                <h3>Contato</h3>
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone (Fixo):</label>
                    <input type="tel" id="telefone" name="telefone" pattern="\([0-9]{2}\) [0-9]{4,5}\-[0-9]{4}" placeholder="Ex: (XX) XXXX-XXXX">
                </div>
                <div class="form-group">
                    <label for="celular">Celular:</label>
                    <input type="tel" id="celular" name="celular" pattern="\([0-9]{2}\) [0-9]{5}\-[0-9]{4}" placeholder="Ex: (XX) 9XXXX-XXXX" required>
                </div>

                <h3>Endereço</h3>
                <div class="form-group">
                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco" required>
                </div>
                <div class="form-group">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>
                </div>
                <div class="form-group">
                    <label for="estado">Estado:</label>
                    <input type="text" id="estado" name="estado" required>
                </div>
                <div class="form-group">
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" pattern="[0-9]{5}\-?[0-9]{3}" placeholder="Ex: 12345-678" required>
                </div>

                <h3>Dados Escolares</h3>
                <div class="form-group">
                    <label for="matricula">Matrícula:</label>
                    <input type="text" id="matricula" name="matricula" required>
                </div>
                <div class="form-group">
                    <label for="curso">Curso:</label>
                    <select id="curso" name="curso" required>
                        <option value="">Selecione o Curso</option>
                        <option value="informatica">Informática</option>
                        <option value="eletrotecnica">Eletrotécnica</option>
                        <option value="mecanica">Mecânica</option>
                        <option value="automacao">Automação Industrial</option>
                        <option value="edificacoes">Edificações</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="serieAno">Série/Ano:</label>
                    <input type="text" id="serieAno" name="serieAno" required>
                </div>
                <div class="form-group">
                    <label for="turma">Turma:</label>
                    <input type="text" id="turma" name="turma" required>
                </div>
                <div class="form-group">
                    <label>Turno:</label>
                    <div class="radio-group">
                        <input type="radio" id="turnoManha" name="turno" value="manha" required>
                        <label for="turnoManha">Manhã</label>
                        <input type="radio" id="turnoTarde" name="turno" value="tarde">
                        <label for="turnoTarde">Tarde</label>
                        <input type="radio" id="turnoNoite" name="turno" value="noite">
                        <label for="turnoNoite">Noite</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="dataMatricula">Data de Matrícula:</label>
                    <input type="date" id="dataMatricula" name="dataMatricula" required>
                </div>

                <h3>Responsável (se menor de idade)</h3>
                <div class="form-group">
                    <label for="nomeResponsavel">Nome do Responsável:</label>
                    <input type="text" id="nomeResponsavel" name="nomeResponsavel">
                </div>
                <div class="form-group">
                    <label for="parentesco">Parentesco:</label>
                    <input type="text" id="parentesco" name="parentesco">
                </div>
                <div class="form-group">
                    <label for="telefoneResponsavel">Telefone do Responsável:</label>
                    <input type="tel" id="telefoneResponsavel" name="telefoneResponsavel" pattern="\([0-9]{2}\) [0-9]{4,5}\-[0-9]{4}" placeholder="Ex: (XX) XXXX-XXXX">
                </div>
                <div class="form-group">
                    <label for="emailResponsavel">E-mail do Responsável:</label>
                    <input type="email" id="emailResponsavel" name="emailResponsavel">
                </div>

                <h3>Informações Adicionais</h3>
                <div class="form-group">
                    <label>Possui alguma deficiência?</label>
                    <div class="radio-group">
                        <input type="radio" id="deficienciaSim" name="deficiencia" value="sim" required>
                        <label for="deficienciaSim">Sim</label>
                        <input type="radio" id="deficienciaNao" name="deficiencia" value="nao">
                        <label for="deficienciaNao">Não</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="atendimentoEspecial">Necessita de atendimento especial? (Descreva)</label>
                    <textarea id="atendimentoEspecial" name="atendimentoEspecial" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="alergias">Alergias:</label>
                    <textarea id="alergias" name="alergias" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="observacoes">Observações:</label>
                    <textarea id="observacoes" name="observacoes" rows="3"></textarea>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="termosUso" name="termosUso" required>
                    <label for="termosUso">Aceito os termos de uso</label>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="autorizarImagem" name="autorizarImagem">
                    <label for="autorizarImagem">Autorizo o uso de imagem</label>
                </div>

                <div class="form-actions">
                    <button type="submit">Enviar Cadastro</button>
                    <button type="reset">Limpar Formulário</button>
                    <button type="button" id="cancelarCadastro">Cancelar</button>
                </div>
            </form>
        </section>

        <section id="consulta-alunos">
            <h2>Alunos Cadastrados</h2>
            <div class="form-group">
                <label for="pesquisaAluno">Pesquisar Aluno:</label>
                <input type="text" id="pesquisaAluno" placeholder="Digite o nome do aluno...">
            </div>
            <div id="lista-alunos-cadastrados" class="lista-alunos">
                <!-- Alunos pré-cadastrados serão inseridos aqui pelo JavaScript -->
            </div>
            <div id="detalhes-aluno" class="detalhes-aluno">
                <!-- Detalhes do aluno selecionado serão exibidos aqui -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 SENAI. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="script.js"></script> <!-- Link para o arquivo JavaScript que vamos criar depois -->
</body>
</html>
